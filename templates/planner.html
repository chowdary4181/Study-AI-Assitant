<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Planner</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #11998e, #38ef7d);
            padding: 30px;
        }

        .navbar {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .navbar h2 {
            font-size: 2.2rem;
            font-weight: 700;
        }

        .container {
            max-width: 850px;
            margin: auto;
        }

        .card {
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 35px;
            margin-bottom: 25px;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .planner-icon {
            text-align: center;
            font-size: 70px;
            margin-bottom: 15px;
        }

        .title {
            text-align: center;
            margin-bottom: 25px;
        }

        .title h3 {
            font-size: 1.8rem;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 8px;
            font-weight: 500;
        }

        textarea,
        input[type="number"] {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            outline: none;
            font-size: 15px;
            background: rgba(255,255,255,0.9);
        }

        textarea {
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: white;
            color: #11998e;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .tips {
            margin-top: 20px;
        }

        .tips p {
            margin: 8px 0;
        }

        .result-card h3 {
            margin-bottom: 15px;
            text-align: center;
        }

        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            background: rgba(255,255,255,0.15);
            padding: 20px;
            border-radius: 15px;
            line-height: 1.7;
        }

        .back-btn {
            display: block;
            text-align: center;
            text-decoration: none;
            color: white;
            margin-top: 15px;
            transition: 0.3s;
        }

        .back-btn:hover {
            opacity: 0.8;
        }

        @media(max-width: 768px) {
            body {
                padding: 15px;
            }

            .card {
                padding: 25px;
            }

            .navbar h2 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h2>📅 AI Study Planner</h2>
    </div>

    <div class="container">

        <div class="card">

            <div class="planner-icon">🎯</div>

            <div class="title">
                <h3>Create Your Personalized Study Plan</h3>
            </div>

            <form method="POST">

                <label>📚 Subjects</label>

                <textarea
                    name="subjects"
                    rows="5"
                    placeholder="Example:
Math
Physics
Chemistry
Biology"
                    required></textarea>

                <label>⏳ Number of Days</label>

                <input
                    type="number"
                    name="days"
                    min="1"
                    placeholder="Enter number of study days"
                    required>

                <button type="submit">
                    🚀 Create Study Plan
                </button>

            </form>

            <div class="tips">
                <p>✅ Smart subject distribution</p>
                <p>✅ Balanced daily schedule</p>
                <p>✅ AI-generated learning roadmap</p>
                <p>✅ Optimized revision planning</p>
            </div>

        </div>

        {% if result %}
        <div class="card result-card">

            <h3>📋 Your Personalized Study Plan</h3>

            <pre>{{ result }}</pre>

        </div>
        {% endif %}

        <a href="/" class="back-btn">
            ⬅ Back to Dashboard
        </a>

    </div>

</body>

</html>
