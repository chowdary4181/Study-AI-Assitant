<!DOCTYPE html>
<html>

<head>

<title>Study Planner</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="navbar">
<h2>📅 Study Planner</h2>
</div>

<div class="container">

<div class="card">

<form method="POST">

<label>Subjects</label>

<textarea
name="subjects"
rows="5"
placeholder="Math, Physics, Chemistry"
required></textarea>

<label>Number of Days</label>

<input
type="number"
name="days"
required>

<button type="submit">
Create Study Plan
</button>

</form>

</div>

{% if result %}

<div class="card">

<h3>Your Study Plan</h3>

<pre>{{ result }}</pre>

</div>

{% endif %}

</div>

</body>
</html>
