<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Quiz Generator</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #ff9966, #ff5e62);
            padding: 30px;
        }

        .navbar {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .navbar h2 {
            font-size: 2.2rem;
            font-weight: 700;
        }

        .container {
            max-width: 850px;
            margin: auto;
        }

        .card {
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 35px;
            margin-bottom: 25px;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .quiz-icon {
            text-align: center;
            font-size: 70px;
            margin-bottom: 15px;
        }

        .title {
            text-align: center;
            margin-bottom: 25px;
        }

        .title h3 {
            font-size: 1.8rem;
        }

        .subtitle {
            text-align: center;
            margin-top: 8px;
            opacity: 0.9;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 500;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            outline: none;
            font-size: 15px;
            background: rgba(255,255,255,0.9);
        }

        input[type="text"]:focus {
            box-shadow: 0 0 15px rgba(255,255,255,0.5);
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: white;
            color: #ff5e62;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .features {
            margin-top: 20px;
        }

        .features p {
            margin: 8px 0;
        }

        .result-card h3 {
            text-align: center;
            margin-bottom: 15px;
        }

        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            background: rgba(255,255,255,0.15);
            padding: 20px;
            border-radius: 15px;
            line-height: 1.7;
            overflow-x: auto;
        }

        .back-btn {
            display: block;
            text-align: center;
            text-decoration: none;
            color: white;
            margin-top: 15px;
            transition: 0.3s;
        }

        .back-btn:hover {
            opacity: 0.8;
        }

        @media(max-width: 768px) {
            body {
                padding: 15px;
            }

            .card {
                padding: 25px;
            }

            .navbar h2 {
                font-size: 1.8rem;
            }

            .title h3 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h2>❓ AI Quiz Generator</h2>
    </div>

    <div class="container">

        <div class="card">

            <div class="quiz-icon">🧠</div>

            <div class="title">
                <h3>Create Interactive Quizzes</h3>
                <p class="subtitle">
                    Generate AI-powered quiz questions for any topic instantly.
                </p>
            </div>

            <form method="POST">

                <label>📚 Enter Topic</label>

                <input
                    type="text"
                    name="topic"
                    placeholder="Example: Python Programming, Data Structures, DBMS"
                    required>

                <button type="submit">
                    🚀 Generate Quiz
                </button>

            </form>

            <div class="features">
                <p>✅ AI-generated questions</p>
                <p>✅ Instant quiz creation</p>
                <p>✅ Topic-based learning</p>
                <p>✅ Perfect for exam preparation</p>
            </div>

        </div>

        {% if result %}
        <div class="card result-card">

            <h3>📋 Generated Quiz</h3>

            <pre>{{ result }}</pre>

        </div>
        {% endif %}

        <a href="/" class="back-btn">
            ⬅ Back to Dashboard
        </a>

    </div>

</body>

</html>
