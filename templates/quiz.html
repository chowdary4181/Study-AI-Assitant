<!DOCTYPE html>
<html>

<head>

<title>Quiz Generator</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="navbar">
<h2>❓ Quiz Generator</h2>
</div>

<div class="container">

<div class="card">

<form method="POST">

<label>Enter Topic</label>

<input
type="text"
name="topic"
placeholder="Python Programming"
required>

<button type="submit">
Generate Quiz
</button>

</form>

</div>

{% if result %}

<div class="card">

<h3>Generated Quiz</h3>

<pre>{{ result }}</pre>

</div>

{% endif %}

</div>

</body>
</html>
