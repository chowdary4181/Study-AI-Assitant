<!DOCTYPE html>
<html>

<head>

<title>PDF Summarizer</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="navbar">
<h2>📄 PDF Summarizer</h2>
</div>

<div class="container">

<div class="card">

<form
method="POST"
enctype="multipart/form-data">

<label>Upload PDF</label>

<input
type="file"
name="pdf"
accept=".pdf"
required>

<button type="submit">
Generate Summary
</button>

</form>

</div>

{% if result %}

<div class="card">

<h3>Summary</h3>

<pre>{{ result }}</pre>

</div>

{% endif %}

</div>

</body>
</html>
